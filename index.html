 else if(t.id=='ci'&&t.files[0]){const r=new FileReader();r.onload=()=>{let n=0;const rows=[];r.result.split(/\r?\n/).forEach(l=>{const c=l.split(/[;,\t]/).map(s=>s.trim().replace(/^"|"$/g,'')),m=(c[1]||'').match(/(\d{1,2})\/(\d{1,2})/);if(c[0]&&m&&!D.m.some(z=>z.nome.toLowerCase()==c[0].toLowerCase())){rows.push({nome:c[0],dia:+m[1],mes:+m[2]});n++}});(async()=>{if(rows.length&&!await db(sb.from('membros').insert(rows)))return;alert(n+' membros importados.');render()})()};r.readAsText(t.files[0])}});
document.addEventListener('click',async x=>{const t=x.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i;const NEED={gl:'acessos',cl:'acessos',reg:'registrar',dv:'registrar',dall:'registrar',sa:'avisos',ea:'avisos',ec:'avisos',da:'avisos',dm:'editmembros',am:'editmembros',ac:'editmembros',dc:'editmembros',em:'editmembros',ce:'editmembros',nu:'usuarios',ru:'usuarios',du:'usuarios'};if(NEED[a]&&!can(NEED[a])){alert('Você não tem permissão para isso.');return}
 if(a=='lo'){x.preventDefault();await sb.auth.signOut({scope:'local'});ME=null;location.hash='#/';render()}else if(a=='li')login();else if(a=='su')setup();else if(a=='nu')addUser();else if(a=='ru')resetUser(t.dataset.i);else if(a=='du')delUser(t.dataset.i);else if(a=='gl')genLink();else if(a=='cl')copyLink();else if(a=='o1')setOrg('convite');else if(a=='o2')setOrg('igreja');else if(a=='rp')rgo(-1);else if(a=='rn')rgo(1);else if(a=='ra'){T.auto=!T.auto;T.left=12;t.textContent=T.auto?'⏸ Auto':'▶ Auto'}else if(a=='tp'){T.pause=!T.pause;t.textContent=T.pause?'Continuar':'Pausar'}else if(a=='tf')fs();
 else if(a=='reg'){const raw=$('#rn').value.trim(),n=raw||'Visitante';
  if(raw&&vis().some(v=>v.nome.toLowerCase()==n.toLowerCase())&&!confirm('Já existe um registro com esse nome hoje. Registrar mesmo assim?'))return;

  $('#rf').innerHTML=`<div class="ok"><i>✓</i><h1 class="d" style="font-size:40px">Registrado!</h1><p>Seja bem-vindo(a) à Assembleia de Deus – Ministério Madureira!</p><button class="btn p" onclick="render()">Registrar outro</button> <a class="btn" href="#/visitantes">Concluir</a></div>`}
 else if(a=='em'){EM=D.m.find(z=>z.id==i);T.mf='';render();$('#mn').scrollIntoView({block:'center'})}
 else if(a=='em0'){EM=null;T.mf='';render()}
 else if(a=='ce'){EC=D.c.find(z=>z.id==i);T.cf='';render();$('#c1').scrollIntoView({block:'center'})}
 else if(a=='ce0'){EC=null;T.cf='';render()}
 else if(a=='ac'){const rid=el=>{if(el.dataset.id)return +el.dataset.id;const f=free(EC&&EC.id).filter(x=>norm(x.nome)==norm(el.value));return f.length==1?f[0].id:0},m1=rid($('#c1')),m2=rid($('#c2')),dt=$('#cd').value.match(/(\d{1,2})\/(\d{1,2})/);if(!m1||!m2){alert('Digite o nome e escolha o membro na lista de sugestões.');return}if(m1==m2){alert('Escolha dois membros diferentes.');return}if(!dt||+dt[1]<1||+dt[1]>31||+dt[2]<1||+dt[2]>12){alert('Informe a data do casamento (dia e mês).');return}const row={membro1:m1,membro2:m2,dia:+dt[1],mes:+dt[2],foto:T.cf||(EC&&!($('#cr')&&$('#cr').checked)?EC.foto:'')};if(await db(EC?sb.from('casais').update(row).eq('id',EC.id):sb.from('casais').insert(row))){T.cf='';EC=null;render()}}
 else if(a=='dc'){if(confirm('Excluir este casal?')){if(await db(sb.from('casais').delete().eq('id',i)))render()}}
 else if(a=='dv'){if(confirm('Excluir este visitante?')){if(await db(sb.from('visitantes').delete().eq('id',i)))render()}}
 else if(a=='dall'){if(confirm('Apagar TODOS os visitantes de hoje? Isso não pode ser desfeito.')){const t=new Date();t.setHours(0,0,0,0);if(await db(sb.from('visitantes').delete().gte('criado_em',t.toISOString())))render()}}
 else if(a=='sa'){const ti=$('#at').value.trim();if(!ti){$('#at').style.borderColor='#B3402F';return}
  const d1=$('#ad1').value||null,d2=$('#ad2').value||null,ex=$('#ae').checked;

  const A0=EA||{},img=T.ai||($('#ar')&&$('#ar').checked?'':A0.img||''),row={titulo:ti,texto:$('#ax').value.trim(),img,ativo:$('#aa').checked,inicio:d1,fim:d2,excluir_auto:ex};
  if(await db(EA?sb.from('avisos').update(row).eq('id',EA.id):sb.from('avisos').insert(row))){EA=null;T.ai='';render()}}
 else if(a=='ea'){EA=D.a.find(z=>z.id==i);T.ai='';render();scrollTo(0,0)}
 else if(a=='ec'){EA=null;T.ai='';render()}
 else if(a=='da'){if(await db(sb.from('avisos').delete().eq('id',i)))render()}

 else if(a=='am'){const n=$('#mn').value.trim(),m=$('#md').value.match(/(\d{1,2})\/(\d{1,2})/);if(!n||!m||+m[1]<1||+m[1]>31||+m[2]<1||+m[2]>12){alert('Informe o nome e um aniversário válido (dia e mês).');return}const row={nome:n,dia:+m[1],mes:+m[2],foto:T.mf||(EM&&!($('#mr')&&$('#mr').checked)?EM.foto:'')};if(await db(EM?sb.from('membros').update(row).eq('id',EM.id):sb.from('membros').insert(row))){T.mf='';EM=null;render()}}});
